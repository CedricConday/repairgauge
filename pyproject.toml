[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repairgauge"
version = "0.1.0"
description = "Per-lesion recovery of a myelin-sensitive MRI value between two scans, with a known-answer backtest."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Cedric Conday"}]
keywords = ["multiple sclerosis", "MRI", "lesion", "remyelination", "myelin", "longitudinal", "neuroimaging"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "nibabel>=5",
  "pandas>=2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
repairgauge = "repairgauge.cli:main"

[tool.setuptools.packages.find]
include = ["repairgauge*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
